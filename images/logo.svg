<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 84" role="img" aria-label="Cleanwalls">
  <defs>
    <linearGradient id="blast" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6fb2"/>
      <stop offset="1" stop-color="#7dc0f0"/>
    </linearGradient>
  </defs>
  <!-- spray burst mark -->
  <g>
    <circle cx="38" cy="42" r="30" fill="#0e2f4e"/>
    <!-- nozzle -->
    <rect x="30" y="38" width="22" height="8" rx="3" fill="#ffffff"/>
    <rect x="24" y="35.5" width="10" height="13" rx="3" fill="#7dc0f0"/>
    <!-- spray lines -->
    <path d="M54 42 L70 42" stroke="url(#blast)" stroke-width="4" stroke-linecap="round"/>
    <path d="M54 34 L66 28" stroke="url(#blast)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M54 50 L66 56" stroke="url(#blast)" stroke-width="3.4" stroke-linecap="round"/>
    <circle cx="74" cy="33" r="2.2" fill="#7dc0f0"/>
    <circle cx="76" cy="42" r="2.4" fill="#1f6fb2"/>
    <circle cx="74" cy="51" r="2.2" fill="#7dc0f0"/>
  </g>
  <!-- wordmark -->
  <text x="92" y="53" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="40" letter-spacing="1" fill="#0e2f4e">CLEAN<tspan fill="#1f6fb2">WALLS</tspan></text>
  <text x="94" y="72" font-family="Arial, sans-serif" font-weight="600" font-size="12.5" letter-spacing="5" fill="#5b7186">SANDBLASTING · ROCHDALE · EST. 35+ YEARS</text>
</svg>
